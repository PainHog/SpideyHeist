name: Release

# Publishes a Foundry-installable release. Fires either when a v* tag is pushed,
# or manually via "Run workflow" (workflow_dispatch) with a version input.
# The manifest URL for Foundry becomes:
#   https://github.com/PainHog/SpideyHeist/releases/latest/download/system.json

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the v prefix, e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version into system.json
        run: |
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("system.json", "utf8"));
            s.version = process.env.VERSION;
            // manifest stays on /latest/ so Foundry can detect future updates;
            // download is pinned to this exact release's asset.
            s.manifest = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/system.json`;
            s.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${process.env.VERSION}/system.zip`;
            fs.writeFileSync("system.json", JSON.stringify(s, null, 2));
          '
        env:
          VERSION: ${{ steps.vars.outputs.version }}

      - name: Build system.zip
        run: |
          zip -r system.zip . \
            -x ".git/*" -x ".github/*" -x "node_modules/*" -x "*.zip" \
            -x "package.json" -x "package-lock.json" -x "tools/*" \
            -x "packs/*/LOCK" -x "packs/*/LOG" -x "packs/*/LOG.old"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: Heisty Spideys v${{ steps.vars.outputs.version }}
          files: |
            system.json
            system.zip
          generate_release_notes: true
